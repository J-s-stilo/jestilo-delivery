<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JESTILO Admin</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:#f7f3ed;
  color:#2d1b12;
  margin:0;
  padding:25px;
}
.container{
  max-width:900px;
  margin:auto;
}
.card{
  background:white;
  padding:25px;
  border-radius:15px;
  box-shadow:0 5px 20px #0001;
  margin-bottom:20px;
}
input,select,textarea{
  width:100%;
  padding:12px;
  margin:7px 0 15px;
  box-sizing:border-box;
  border:1px solid #ddd;
  border-radius:8px;
  font-family:Arial,sans-serif;
}
textarea{
  min-height:90px;
  resize:vertical;
}
button{
  background:#f36b16;
  color:white;
  border:0;
  padding:12px 20px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}
button.delete{
  background:#a93226;
}
.hidden{
  display:none;
}
.success{
  color:green;
}
.error{
  color:#a93226;
}
.help{
  color:#666;
  font-size:13px;
  margin-top:-8px;
}
table{
  width:100%;
  border-collapse:collapse;
  overflow:hidden;
}
th,td{
  padding:10px;
  border-bottom:1px solid #ddd;
  text-align:left;
}
.preview{
  max-width:180px;
  max-height:150px;
  border-radius:10px;
  margin-top:5px;
}
@media(max-width:600px){
  body{
    padding:15px;
  }
  .card{
    padding:18px;
  }
  table{
    font-size:12px;
  }
}
</style>
</head>

<body>

<div class="container">

<h1>JESTILO DELIVERY SERVICE</h1>

<div class="card" id="loginBox">

<h2>Admin Login</h2>

<input
  id="password"
  type="password"
  placeholder="Admin password"
>

<button onclick="login()">Login</button>

<p id="loginMessage"></p>

</div>


<div class="card hidden" id="adminBox">

<h2>Create / Update Shipment</h2>

<label>Tracking Number</label>

<input
  id="code"
  placeholder="Example: JST-2026-001"
>


<label>Customer Name</label>

<input
  id="customer"
  placeholder="Customer full name"
>


<label>Customer Email</label>

<input
  id="email"
  type="email"
  placeholder="customer@example.com"
>


<label>Customer WhatsApp</label>

<input
  id="whatsapp"
  placeholder="Example: +628123456789"
>

<p class="help">
Include the country code, for example +62 for Indonesia.
</p>


<label>Package / Item Name</label>

<input
  id="item_name"
  placeholder="Example: Personal gifts"
>


<label>Package Description</label>

<textarea
  id="item_description"
  placeholder="Describe the package contents"
></textarea>


<label>Package Image URL</label>

<input
  id="image_url"
  placeholder="https://example.com/package.jpg"
>

<p class="help">
Use an image URL for the package image. Do not put private or sensitive images on a public website.
</p>

<img
  id="imagePreview"
  class="preview hidden"
  alt="Package preview"
>


<label>Origin</label>

<input
  id="origin"
  placeholder="Example: United Kingdom"
>


<label>Destination</label>

<input
  id="destination"
  placeholder="Example: Indonesia"
>


<label>Shipment Status</label>

<select id="status">

<option>Order received</option>
<option>Processing</option>
<option>In transit</option>
<option>Arrived at destination</option>
<option>Out for delivery</option>
<option>Delivered</option>
<option>On hold</option>

</select>


<label>Current Location</label>

<input
  id="location"
  placeholder="Example: Jakarta, Indonesia"
>


<label>Estimated Delivery</label>

<input
  id="estimated_delivery"
  type="datetime-local"
>


<label>Shipment Update</label>

<textarea
  id="note"
  placeholder="Example: Shipment has arrived at the destination country."
></textarea>


<button onclick="saveShipment()">
Save Shipment
</button>

<button
  type="button"
  onclick="clearForm()"
  style="background:#777;margin-left:8px;"
>
Clear
</button>

<p id="saveMessage"></p>


<hr>

<h2>Shipments</h2>

<div id="records">
Loading...
</div>

</div>

</div>


<script>

let token = "";


async function login(){

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("loginMessage");

  try{

    const response =
      await fetch("/api/admin/login",{

        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          password:password
        })

      });


    const data =
      await response.json();


    if(!response.ok){

      message.className="error";

      message.textContent =
        "Incorrect password.";

      return;
    }


    token=data.token;


    document
      .getElementById("loginBox")
      .classList.add("hidden");


    document
      .getElementById("adminBox")
      .classList.remove("hidden");


    loadShipments();

  }catch(error){

    message.className="error";

    message.textContent =
      "Could not connect to the server.";
  }
}
