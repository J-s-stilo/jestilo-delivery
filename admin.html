JESTILO Admin Page

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JESTILO Admin</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:25px;
  font-family:Arial,sans-serif;
  background:#f5f1eb;
  color:#2d1b12;
}

.container{
  max-width:950px;
  margin:auto;
}

.card{
  background:white;
  padding:25px;
  border-radius:16px;
  box-shadow:0 6px 25px rgba(45,27,18,.10);
  margin-bottom:20px;
}

h1{
  margin-top:0;
}

input,select,textarea{
  width:100%;
  padding:13px;
  margin:7px 0 15px;
  border:1px solid #ddd;
  border-radius:9px;
  font:inherit;
}

textarea{
  min-height:90px;
  resize:vertical;
}

button{
  border:0;
  border-radius:9px;
  padding:13px 20px;
  background:#f36b16;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}

button.delete{
  background:#a93226;
}

button.clear{
  background:#777;
  margin-left:8px;
}

.hidden{
  display:none;
}

.success{
  color:green;
}

.error{
  color:#a93226;
}

.help{
  color:#777;
  font-size:13px;
  margin-top:-8px;
}

.preview{
  display:none;
  max-width:220px;
  max-height:180px;
  margin:5px 0 15px;
  border-radius:12px;
  object-fit:cover;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:650px;
}

th,td{
  padding:11px;
  border-bottom:1px solid #ddd;
  text-align:left;
}

@media(max-width:600px){
  body{
    padding:15px;
  }

  .card{
    padding:18px;
  }
}
</style>
</head>

<body>

<div class="container">

<h1>JESTILO DELIVERY SERVICE</h1>

<!-- ADMIN LOGIN -->

<div class="card" id="loginBox">

<h2>Admin Login</h2>

<input
  id="password"
  type="password"
  placeholder="Enter admin password"
  autocomplete="current-password"
>

<button type="button" onclick="login()">
Login
</button>

<p id="loginMessage"></p>

</div>


<!-- ADMIN DASHBOARD -->

<div class="card hidden" id="adminBox">

<h2>Create / Update Shipment</h2>

<label>Tracking Number</label>

<input
  id="code"
  placeholder="Example: JST-2026-001"
>


<label>Customer Name</label>

<input
  id="customer"
  placeholder="Customer full name"
>


<label>Customer Email</label>

<input
  id="email"
  type="email"
  placeholder="customer@example.com"
>


<label>Customer WhatsApp</label>

<input
  id="whatsapp"
  placeholder="+628123456789"
>


<label>Package / Item Name</label>

<input
  id="item_name"
  placeholder="Example: Personal gifts"
>


<label>Package Description</label>

<textarea
  id="item_description"
  placeholder="Describe the package contents"
></textarea>


<label>Package Image URL</label>

<input
  id="image_url"
  placeholder="https://example.com/package.jpg"
>

<p class="help">
Use a publicly accessible image URL.
</p>

<img
  id="imagePreview"
  class="preview"
  alt="Package preview"
>


<label>Origin</label>

<input
  id="origin"
  placeholder="Example: United Kingdom"
>


<label>Destination</label>

<input
  id="destination"
  placeholder="Example: Indonesia"
>


<label>Shipment Status</label>

<select id="status">

<option>Order received</option>
<option>Processing</option>
<option>In transit</option>
<option>Arrived at destination</option>
<option>Out for delivery</option>
<option>Delivered</option>
<option>On hold</option>

</select>


<label>Current Location</label>

<input
  id="location"
  placeholder="Example: Jakarta, Indonesia"
>


<label>Estimated Delivery</label>

<input
  id="estimated_delivery"
  type="datetime-local"
>


<label>Shipment Update</label>

<textarea
  id="note"
  placeholder="Write the latest shipment update"
></textarea>


<button type="button" onclick="saveShipment()">
Save Shipment
</button>

<button
  type="button"
  class="clear"
  onclick="clearForm()"
>
Clear
</button>

<p id="saveMessage"></p>


<hr>

<h2>Saved Shipments</h2>

<div id="records">
Loading...
</div>

</div>

</div>


<script>

let token = "";


/* LOGIN */

async function login(){

  const password =
    document.getElementById("password").value.trim();

  const message =
    document.getElementById("loginMessage");

  message.textContent = "";

  if(!password){

    message.className = "error";
    message.textContent =
      "Please enter your admin password.";

    return;
  }

  try{

    const response =
      await fetch("/api/admin/login",{

        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          password:password
        })

      });


    const data =
      await response.json();


    if(!response.ok){

      message.className = "error";

      message.textContent =
        data.error || "Incorrect password.";

      return;
    }


    if(!data.token){

      message.className = "error";

      message.textContent =
        "Login failed. No session was created.";

      return;
    }


    token = data.token;


    document
      .getElementById("loginBox")
      .classList.add("hidden");


    document
      .getElementById("adminBox")
      .classList.remove("hidden");


    loadShipments();


  }catch(error){

    console.error(error);

    message.className = "error";

    message.textContent =
      "Could not connect to the server.";

  }

}


/* SAVE / UPDATE SHIPMENT */

async function saveShipment(){

  const message =
    document.getElementById("saveMessage");


  const shipment = {

    code:
      document.getElementById("code").value.trim(),

    customer:
      document.getElementById("customer").value.trim(),

    email:
      document.getElementById("email").value.trim(),

    whatsapp:
      document.getElementById("whatsapp").value.trim(),

    item_name:
      document.getElementById("item_name").value.trim(),

    item_description:
      document
        .getElementById("item_description")
        .value
        .trim(),

    image_url:
      document
        .getElementById("image_url")
        .value
        .trim(),

    origin:
      document.getElementById("origin").value.trim(),

    destination:
      document
        .getElementById("destination")
        .value
        .trim(),

    status:
      document.getElementById("status").value,

    location:
      document
        .getElementById("location")
        .value
        .trim(),

    estimated_delivery:
      document
        .getElementById("estimated_delivery")
        .value,

    note:
      document
        .getElementById("note")
        .value
        .trim()

  };


  if(!shipment.code){

    message.className = "error";

    message.textContent =
      "Enter a tracking number.";

    return;
  }


  if(!token){

    message.className = "error";

    message.textContent =
      "Please login again.";

    return;
  }


  try{

    const response =
      await fetch(
        "/api/admin/shipments",
        {

          method:"POST",

          headers:{
            "Content-Type":"application/json",
            "Authorization":
              "Bearer " + token
          },

          body:
            JSON.stringify(shipment)

        }
      );


    const data =
      await response.json();


    if(!response.ok){

      message.className = "error";

      message.textContent =
        data.error ||
        "Could not save shipment.";

      return;
    }


    message.className = "success";

    message.textContent =
      "Shipment saved successfully.";


    clearForm(false);

    loadShipments();


  }catch(error){

    console.error(error);

    message.className = "error";

    message.textContent =
      "Could not connect to the server.";

  }

}


/* LOAD SHIPMENTS */

async function loadShipments(){

  const box =
    document.getElementById("records");


  try{

    const response =
      await fetch(
        "/api/admin/shipments",
        {
          headers:{
            "Authorization":
              "Bearer " + token
          }
        }
      );


    const data =
      await response.json();


    if(!response.ok){

      box.innerHTML =
        "<p class='error'>Could not load shipments.</p>";

      return;
    }


    if(!Array.isArray(data) || data.length === 0){

      box.innerHTML =
        "<p>No shipments yet.</p>";

      return;
    }


    box.innerHTML = `

      <div class="table-wrap">

      <table>

        <tr>
          <th>Tracking</th>
          <th>Customer</th>
          <th>Status</th>
          <th>Destination</th>
          <th>Action</th>
        </tr>

        ${
          data.map(function(x){

            return `

              <tr>

                <td>
                  ${escapeHtml(x.code)}
                </td>

                <td>
                  ${escapeHtml(
                    x.customer || "-"
                  )}
                </td>

                <td>
                  ${escapeHtml(
                    x.status || "-"
                  )}
                </td>

                <td>
                  ${escapeHtml(
                    x.destination || "-"
                  )}
                </td>

                <td>

                  <button
                    type="button"
                    class="delete"
                    onclick="deleteShipment(
                      '${encodeURIComponent(x.code)}'
                    )"
                  >
                    Delete
                  </button>

                </td>

              </tr>

            `;

          }).join("")
        }

      </table>

      </div>
    `;


  }catch(error){

    console.error(error);

    box.innerHTML =
      "<p class='error'>Could not load shipments.</p>";

  }

}


/* DELETE */

async function deleteShipment(encodedCode){

  const code =
    decodeURIComponent(encodedCode);


  if(!confirm(
    "Delete shipment " + code + "?"
  )){

    return;

  }


  try{

    const response =
      await fetch(
        "/api/admin/shipments/" +
        encodeURIComponent(code),
        {

          method:"DELETE",

          headers:{
            "Authorization":
              "Bearer " + token
          }

        }
      );


    if(!response.ok){

      alert(
        "Could not delete shipment."
      );

      return;
    }


    loadShipments();


  }catch(error){

    console.error(error);

    alert(
      "Could not delete shipment."
    );

  }

}


/* CLEAR FORM */

function clearForm(showMessage = true){

  document.getElementById("code").value = "";
  document.getElementById("customer").value = "";
  document.getElementById("email").value = "";
  document.getElementById("whatsapp").value = "";
  document.getElementById("item_name").value = "";
  document.getElementById("item_description").value = "";
  document.getElementById("image_url").value = "";
  document.getElementById("origin").value = "";
  document.getElementById("destination").value = "";
  document.getElementById("status").value =
    "Order received";
  document.getElementById("location").value = "";
  document.getElementById("estimated_delivery").value = "";
  document.getElementById("note").value = "";


  const preview =
    document.getElementById("imagePreview");

  preview.src = "";
  preview.style.display = "none";


  if(showMessage){

    document.getElementById(
      "saveMessage"
    ).textContent = "";

  }

}


/* IMAGE PREVIEW */

document
  .getElementById("image_url")
  .addEventListener(
    "input",
    function(){

      const url =
        this.value.trim();

      const preview =
        document.getElementById(
          "imagePreview"
        );


      if(!url){

        preview.src = "";
        preview.style.display =
          "none";

        return;
      }


      preview.src = url;

      preview.onload = function(){

        preview.style.display =
          "block";

      };


      preview.onerror = function(){

        preview.style.display =
          "none";

      };

    }
  );


/* ESCAPE HTML */

function escapeHtml(value){

  return String(value || "").replace(
    /[&<>"']/g,
    function(m){

      return {

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"

      }[m];

    }
  );

}


/* ENTER KEY FOR LOGIN */

document
  .getElementById("password")
  .addEventListener(
    "keydown",
    function(event){

      if(event.key === "Enter"){

        login();

      }

    }
  );

</script>

</body>
  </html>
