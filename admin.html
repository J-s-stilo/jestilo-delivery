<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>JESTILO Admin</title>

<style>
*{box-sizing:border-box}

body{
  font-family:Arial,sans-serif;
  background:#f7f3ed;
  color:#2d1b12;
  margin:0;
  padding:25px;
}

.container{
  max-width:900px;
  margin:auto;
}

.card{
  background:white;
  padding:25px;
  border-radius:15px;
  box-shadow:0 5px 20px #0001;
  margin-bottom:20px;
}

input,select,textarea{
  width:100%;
  padding:12px;
  margin:7px 0 15px;
  border:1px solid #ddd;
  border-radius:8px;
  font-family:Arial,sans-serif;
}

textarea{
  min-height:90px;
  resize:vertical;
}

button{
  background:#f36b16;
  color:white;
  border:0;
  padding:12px 20px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

button.delete{
  background:#a93226;
}

button.clear{
  background:#777;
  margin-left:8px;
}

button.edit{
  background:#1769aa;
  margin-right:6px;
}

.hidden{
  display:none;
}

.success{
  color:green;
}

.error{
  color:#a93226;
}

.help{
  color:#666;
  font-size:13px;
  margin-top:-8px;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:10px;
  border-bottom:1px solid #ddd;
  text-align:left;
}

.preview{
  display:block;
  width:100%;
  max-width:350px;
  max-height:250px;
  object-fit:cover;
  border-radius:12px;
  margin:10px 0 18px;
}

.file-box{
  background:#faf7f3;
  border:1px dashed #d7c4b3;
  padding:15px;
  border-radius:10px;
}

.location-box{
  background:#f8f5f1;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
}

@media(max-width:600px){

  body{
    padding:15px;
  }

  .card{
    padding:18px;
  }

  table{
    font-size:12px;
  }

}
</style>
</head>

<body>

<div class="container">

<h1>JESTILO DELIVERY SERVICE</h1>


<!-- LOGIN -->

<div class="card" id="loginBox">

<h2>Admin Login</h2>

<input
  id="password"
  type="password"
  placeholder="Admin password"
>

<button
  type="button"
  onclick="login()"
>
Login
</button>

<p id="loginMessage"></p>

</div>


<!-- ADMIN -->

<div class="card hidden" id="adminBox">

<h2>Create / Update Shipment</h2>

<label>Tracking Number</label>

<input
  id="code"
  placeholder="Example: RT_61_818"
>


<label>Customer Name</label>

<input
  id="customer"
  placeholder="Customer full name"
>


<label>Customer Email</label>

<input
  id="email"
  type="email"
  placeholder="customer@example.com"
>


<label>Customer WhatsApp</label>

<input
  id="whatsapp"
  placeholder="Example: +628123456789"
>

<p class="help">
Include the country code.
</p>


<label>Package / Item Name</label>

<input
  id="item_name"
  placeholder="Example: Personal Gifts"
>


<label>Package Description</label>

<textarea
  id="item_description"
  placeholder="Describe the package contents"
></textarea>


<label>Package Photo</label>

<div class="file-box">

<input
  id="image_file"
  type="file"
  accept="image/jpeg,image/png,image/webp"
>

<p class="help">
Choose the package photo directly from your phone.
</p>

<img
  id="imagePreview"
  class="preview hidden"
  alt="Package preview"
>

</div>


<label>Origin</label>

<input
  id="origin"
  placeholder="Example: United Kingdom"
>


<label>Destination</label>

<input
  id="destination"
  placeholder="Example: Indonesia"
>


<label>Shipment Status</label>

<select id="status">

<option>Order received</option>
<option>Processing</option>
<option>In transit</option>
<option>Arrived at destination</option>
<option>Out for delivery</option>
<option>Delivered</option>
<option>On hold</option>

</select>


<label>Current Location</label>

<input
  id="location"
  placeholder="Example: Jakarta, Indonesia"
>


<!-- MAP LOCATION -->

<div class="location-box">

<h3>📍 Map Coordinates</h3>

<p class="help">
Enter the latitude and longitude for the shipment's current position.
</p>

<label>Latitude</label>

<input
  id="latitude"
  type="number"
  step="any"
  placeholder="Example: -6.2088"
>


<label>Longitude</label>

<input
  id="longitude"
  type="number"
  step="any"
  placeholder="Example: 106.8456"
>

</div>


<label>Estimated Delivery</label>

<input
  id="estimated_delivery"
  type="datetime-local"
>


<label>Shipment Update</label>

<textarea
  id="note"
  placeholder="Example: Shipment has arrived at the destination country."
></textarea>


<button
  type="button"
  onclick="saveShipment()"
>
Save Shipment
</button>

<button
  type="button"
  class="clear"
  onclick="clearForm()"
>
Clear
</button>

<p id="saveMessage"></p>


<hr>

<h2>Shipments</h2>

<div id="records">
Loading...
</div>

</div>

</div>


<script>


/* =========================================
   TOKEN
========================================= */

let token =
  localStorage.getItem(
    "jestilo_admin_token"
  ) || "";


/* =========================================
   SHOW ADMIN
========================================= */

function showAdmin(){

  document
    .getElementById("loginBox")
    .classList.add("hidden");

  document
    .getElementById("adminBox")
    .classList.remove("hidden");

}


/* =========================================
   SHOW LOGIN
========================================= */

function showLogin(){

  document
    .getElementById("loginBox")
    .classList.remove("hidden");

  document
    .getElementById("adminBox")
    .classList.add("hidden");

}


/* =========================================
   LOGOUT / CLEAR TOKEN
========================================= */

function clearToken(){

  token = "";

  localStorage.removeItem(
    "jestilo_admin_token"
  );

  showLogin();

}


/* =========================================
   LOGIN
========================================= */

async function login(){

  const password =
    document
      .getElementById("password")
      .value;

  const message =
    document
      .getElementById("loginMessage");


  if(!password){

    message.className =
      "error";

    message.textContent =
      "Enter your admin password.";

    return;
  }


  try{

    const response =
      await fetch(
        "/api/admin/login",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              password:password
            })
        }
      );


    const data =
      await response.json();


    if(!response.ok){

      message.className =
        "error";

      message.textContent =
        data.error ||
        "Incorrect password.";

      return;
    }


    if(!data.token){

      message.className =
        "error";

      message.textContent =
        "Login failed.";

      return;
    }


    token =
      data.token;


    localStorage.setItem(
      "jestilo_admin_token",
      token
    );


    document
      .getElementById("password")
      .value = "";


    message.textContent =
      "";


    showAdmin();


    loadShipments();


  }catch(error){

    console.error(error);

    message.className =
      "error";

    message.textContent =
      "Could not connect to the server.";

  }

}


/* =========================================
   IMAGE PREVIEW
========================================= */

document
  .getElementById("image_file")
  .addEventListener(
    "change",
    function(){

      const file =
        this.files[0];

      const preview =
        document.getElementById(
          "imagePreview"
        );


      if(!file){

        preview.src = "";

        preview.classList.add(
          "hidden"
        );

        return;
      }


      if(
        !file.type.startsWith(
          "image/"
        )
      ){

        alert(
          "Please choose an image file."
        );

        this.value = "";

        return;
      }


      if(file.size > 800000){

        alert(
          "Please choose an image smaller than 800 KB."
        );

        this.value = "";

        preview.src = "";

        preview.classList.add(
          "hidden"
        );

        return;
      }


      const reader =
        new FileReader();


      reader.onload =
        function(event){

          preview.src =
            event.target.result;

          preview.classList.remove(
            "hidden"
          );

        };


      reader.readAsDataURL(file);

    }
  );


/* =========================================
   EDIT SHIPMENT
   ONLY ADDED FUNCTION
========================================= */

function editShipment(encodedShipment){

  try{

    const shipment =
      JSON.parse(
        decodeURIComponent(
          encodedShipment
        )
      );


    document.getElementById("code").value =
      shipment.code || "";

    document.getElementById("customer").value =
      shipment.customer || "";

    document.getElementById("email").value =
      shipment.email || "";

    document.getElementById("whatsapp").value =
      shipment.whatsapp || "";

    document.getElementById("item_name").value =
      shipment.item_name || "";

    document.getElementById("item_description").value =
      shipment.item_description || "";

    document.getElementById("origin").value =
      shipment.origin || "";

    document.getElementById("destination").value =
      shipment.destination || "";

    document.getElementById("status").value =
      shipment.status || "Order received";

    document.getElementById("location").value =
      shipment.location || "";

    document.getElementById("latitude").value =
      shipment.latitude ?? "";

    document.getElementById("longitude").value =
      shipment.longitude ?? "";

    document.getElementById("estimated_delivery").value =
      shipment.estimated_delivery || "";

    document.getElementById("note").value =
      shipment.note || "";


    const preview =
      document.getElementById(
        "imagePreview"
      );


    if(shipment.image_url){

      preview.src =
        shipment.image_url;

      preview.classList.remove(
        "hidden"
      );

    }else{

      preview.src = "";

      preview.classList.add(
        "hidden"
      );

    }


    document
      .getElementById("saveMessage")
      .className =
        "success";

    document
      .getElementById("saveMessage")
      .textContent =
        "Shipment loaded. Change the status and save.";


    window.scrollTo({
      top:0,
      behavior:"smooth"
    });


  }catch(error){

    console.error(error);

    alert(
      "Could not load shipment for editing."
    );

  }

}


/* =========================================
   SAVE SHIPMENT
========================================= */

async function saveShipment(){

  const message =
    document.getElementById(
      "saveMessage"
    );


  const imagePreview =
    document.getElementById(
      "imagePreview"
    );


  const shipment = {

    code:
      document
        .getElementById("code")
        .value
        .trim(),

    customer:
      document
        .getElementById("customer")
        .value
        .trim(),

    email:
      document
        .getElementById("email")
        .value
        .trim(),

    whatsapp:
      document
        .getElementById("whatsapp")
        .value
        .trim(),

    item_name:
      document
        .getElementById("item_name")
        .value
        .trim(),

    item_description:
      document
        .getElementById("item_description")
        .value
        .trim(),

    image_url:
      imagePreview.src || "",

    origin:
      document
        .getElementById("origin")
        .value
        .trim(),

    destination:
      document
        .getElementById("destination")
        .value,

    status:
      document
        .getElementById("status")
        .value,

    location:
      document
        .getElementById("location")
        .value
        .trim(),

    latitude:
      document
        .getElementById("latitude")
        .value,

    longitude:
      document
        .getElementById("longitude")
        .value,

    estimated_delivery:
      document
        .getElementById(
          "estimated_delivery"
        )
        .value,

    note:
      document
        .getElementById("note")
        .value
        .trim()

  };


  if(!shipment.code){

    message.className =
      "error";

    message.textContent =
      "Enter a tracking number.";

    return;
  }


  try{

    message.className = "";

    message.textContent =
      "Saving shipment...";


    const response =
      await fetch(
        "/api/admin/shipments",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json",

            "Authorization":
              "Bearer " + token
          },

          body:
            JSON.stringify(
              shipment
            )
        }
      );


    if(response.status === 401){

      clearToken();

      document
        .getElementById(
          "loginMessage"
        )
        .className =
          "error";

      document
        .getElementById(
          "loginMessage"
        )
        .textContent =
          "Your admin session expired. Please login again.";

      return;
    }


    const data =
      await response.json();


    if(!response.ok){

      message.className =
        "error";

      message.textContent =
        data.error ||
        "Could not save shipment.";

      return;
    }


    message.className =
      "success";

    message.textContent =
      "Shipment saved successfully.";


    clearForm();


    loadShipments();


  }catch(error){

    console.error(error);

    message.className =
      "error";

    message.textContent =
      "Could not connect to the server.";

  }

}


/* =========================================
   LOAD SHIPMENTS
========================================= */

async function loadShipments(){

  const box =
    document.getElementById(
      "records"
    );


  if(!token){

    showLogin();

    box.innerHTML = "";

    return;
  }


  try{

    const response =
      await fetch(
        "/api/admin/shipments",
        {
          headers:{
            "Authorization":
              "Bearer " + token
          }
        }
      );


    if(response.status === 401){

      clearToken();

      document
        .getElementById(
          "loginMessage"
        )
        .className =
          "error";

      document
        .getElementById(
          "loginMessage"
        )
        .textContent =
          "Your admin session expired. Please login again.";

      return;
    }


    const data =
      await response.json();


    if(!response.ok){

      box.innerHTML =
        "<p class='error'>Could not load shipments.</p>";

      return;
    }


    if(!Array.isArray(data)){

      box.innerHTML =
        "<p class='error'>Invalid shipment data.</p>";

      return;
    }


    if(!data.length){

      box.innerHTML =
        "<p>No shipments yet.</p>";

      return;
    }


    box.innerHTML = `

      <table>

        <tr>

          <th>Tracking</th>

          <th>Customer</th>

          <th>Status</th>

          <th>Destination</th>

          <th>Map</th>

          <th>Action</th>

        </tr>


        ${data.map(x => {

          const shipmentData =
            encodeURIComponent(
              JSON.stringify(x)
            );


          return `

          <tr>

            <td>
              ${escapeHtml(x.code)}
            </td>

            <td>
              ${escapeHtml(
                x.customer || "-"
              )}
            </td>

            <td>
              ${escapeHtml(
                x.status || "-"
              )}
            </td>

            <td>
              ${escapeHtml(
                x.destination || "-"
              )}
            </td>

            <td>

              ${
                x.latitude !== null &&
                x.latitude !== undefined &&
                x.longitude !== null &&
                x.longitude !== undefined
                  ? "📍 Ready"
                  : "—"
              }

            </td>

            <td>

              <button
                type="button"
                class="edit"
                onclick="editShipment(
                  '${shipmentData}'
                )"
              >
                Edit
              </button>

              <button
                type="button"
                class="delete"
                onclick="deleteShipment(
                  '${encodeURIComponent(
                    x.code
                  )}'
                )"
              >
                Delete
              </button>

            </td>

          </tr>

          `;

        }).join("")}

      </table>

    `;


  }catch(error){

    console.error(error);

    box.innerHTML =
      "<p class='error'>Could not load shipments.</p>";

  }

}


/* =========================================
   DELETE
========================================= */

async function deleteShipment(
  encodedCode
){

  const code =
    decodeURIComponent(
      encodedCode
    );


  if(
    !confirm(
      "Delete this shipment?"
    )
  ){
    return;
  }


  try{

    const response =
      await fetch(
        "/api/admin/shipments/" +
        encodeURIComponent(code),
        {
          method:"DELETE",

          headers:{
            "Authorization":
              "Bearer " + token
          }
        }
      );


    if(response.status === 401){

      clearToken();

      document
        .getElementById(
          "loginMessage"
        )
        .className =
          "error";

      document
        .getElementById(
          "loginMessage"
        )
        .textContent =
          "Your admin session expired. Please login again.";

      return;
    }


    if(!response.ok){

      alert(
        "Could not delete shipment."
      );

      return;
    }


    loadShipments();


  }catch(error){

    console.error(error);

    alert(
      "Could not delete shipment."
    );

  }

}


/* =========================================
   CLEAR FORM
========================================= */

function clearForm(){

  document.getElementById(
    "code"
  ).value = "";

  document.getElementById(
    "customer"
  ).value = "";

  document.getElementById(
    "email"
  ).value = "";

  document.getElementById(
    "whatsapp"
  ).value = "";

  document.getElementById(
    "item_name"
  ).value = "";

  document.getElementById(
    "item_description"
  ).value = "";

  document.getElementById(
    "origin"
  ).value = "";

  document.getElementById(
    "destination"
  ).value = "";

  document.getElementById(
    "status"
  ).value =
    "Order received";

  document.getElementById(
    "location"
  ).value = "";

  document.getElementById(
    "latitude"
  ).value = "";

  document.getElementById(
    "longitude"
  ).value = "";

  document.getElementById(
    "estimated_delivery"
  ).value = "";

  document.getElementById(
    "note"
  ).value = "";

  document.getElementById(
    "image_file"
  ).value = "";


  const preview =
    document.getElementById(
      "imagePreview"
    );


  preview.src = "";

  preview.classList.add(
    "hidden"
  );

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value){

  return String(
    value || ""
  ).replace(
    /[&<>"']/g,
    function(m){

      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[m];

    }
  );

}


/* =========================================
   AUTO LOGIN FROM SAVED TOKEN
========================================= */

if(token){

  showAdmin();

  loadShipments();

}else{

  showLogin();

}

</script>

</body>
</html>
