<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JESTILO Admin</title><style>body{font-family:Arial;background:#f7f3ed;padding:30px;color:#2d1b12}.panel{background:#fff;padding:24px;border-radius:16px;max-width:850px;margin:auto}input,select,textarea{width:100%;padding:13px;margin:7px 0 15px;box-sizing:border-box}.btn{background:#f36b16;color:#fff;border:0;padding:13px 20px;border-radius:9px;font-weight:bold}table{width:100%;margin-top:20px;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}.danger{background:#a93226}</style></head><body><div class="panel"><h1>JESTILO Admin</h1><div id="login"><input id="password" type="password" placeholder="Admin password"><button class="btn" onclick="login()">Sign in</button><p id="msg"></p></div><div id="app" style="display:none"><h2>Shipment</h2><input id="code" placeholder="Tracking number"><input id="customer" placeholder="Customer"><select id="status"><option>Order received</option><option>Processing</option><option>In transit</option><option>Arrived at destination</option><option>Out for delivery</option><option>Delivered</option><option>On hold</option></select><input id="location" placeholder="Current location"><textarea id="note" placeholder="Update / note"></textarea><button class="btn" onclick="save()">Save Shipment</button><p id="saveMsg"></p><div id="records"></div></div></div><script>let token='';async function login(){let r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:password.value})});if(!r.ok){msg.textContent='Incorrect password.';return}token=(await r.json()).token;document.getElementById('login').style.display='none';app.style.display='block';load()}async function save(){let b={code:code.value.trim().toUpperCase(),customer:customer.value.trim(),status:status.value,location:location.value.trim(),note:note.value.trim()};let r=await fetch('/api/admin/shipments',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify(b)});saveMsg.textContent=r.ok?'Shipment saved.':'Could not save.';load()}async function load(){let r=await fetch('/api/admin/shipments',{headers:{Authorization:'Bearer '+token}}),d=await r.json();records.innerHTML='<table><tr><th>Tracking</th><th>Status</th><th>Location</th><th>Updated</th></tr>'+d.map(x=>'<tr><td>'+e(x.code)+'</td><td>'+e(x.status)+'</td><td>'+e(x.location)+'</td><td>'+e(x.updated)+'</td></tr>').join('')+'</table>'}function e(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}</script></body></html>
