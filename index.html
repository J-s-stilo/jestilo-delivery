<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JESTILO DELIVERY SERVICE</title><style>body{margin:0;font-family:Arial;background:#f7f3ed;color:#2d1b12}header{background:#2d1b12;color:white;padding:18px 7%;display:flex;justify-content:space-between}a{color:white;margin-left:18px}.hero{padding:70px 7%;background:#fffaf3}section{padding:45px 7%}.btn{background:#f36b16;color:#fff;border:0;padding:13px 20px;border-radius:9px;font-weight:bold}input,select,textarea{width:100%;padding:13px;margin:7px 0 15px;box-sizing:border-box;border:1px solid #dfcdbb;border-radius:8px}.panel{background:white;padding:24px;border-radius:16px;max-width:800px}.status{margin-top:18px;padding:18px;background:#f8eee5;border-radius:10px}.error{color:#a93226}</style></head><body><header><b>JESTILO DELIVERY SERVICE</b><nav><a href="#track">Track</a><a href="/admin.html">Admin</a></nav></header><section class="hero"><h1>Reliable delivery, wherever you need it.</h1><p>Track a shipment and view its latest delivery status.</p></section><section id="track"><h2>Track Your Delivery</h2><div class="panel"><input id="code" placeholder="Enter tracking number"><button class="btn" onclick="track()">Check Status</button><div id="result"></div></div></section><script>async function track(){let c=document.getElementById('code').value.trim().toUpperCase(),r=document.getElementById('result');if(!c){r.innerHTML='<div class="status error">Please enter a tracking number.</div>';return}let x=await fetch('/api/shipments/'+encodeURIComponent(c));if(!x.ok){r.innerHTML='<div class="status">No shipment was found.</div>';return}let d=await x.json();r.innerHTML='<div class="status"><h3>'+e(d.status)+'</h3><p><b>Tracking:</b> '+e(d.code)+'</p>'+(d.customer?'<p><b>Customer:</b> '+e(d.customer)+'</p>':'')+(d.location?'<p><b>Location:</b> '+e(d.location)+'</p>':'')+(d.note?'<p><b>Update:</b> '+e(d.note)+'</p>':'')+'<p>Last updated: '+e(d.updated)+'</p></div>'}function e(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}</script></body></html>
