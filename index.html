<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>JESTILO Delivery Service | International Shipment Tracking</title>

<meta name="description"
content="JESTILO Delivery Service provides international shipment support and online shipment tracking.">

<style>
*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f6f4f1;
  color:#211a16;
  line-height:1.6;
}

a{
  color:inherit;
}

.container{
  width:min(1120px,92%);
  margin:auto;
}

/* HEADER */

header{
  background:#171717;
  color:white;
  position:sticky;
  top:0;
  z-index:1000;
  box-shadow:0 3px 18px rgba(0,0,0,.12);
}

.nav{
  min-height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo{
  font-weight:800;
  letter-spacing:.5px;
  font-size:19px;
}

.logo span{
  color:#f36b16;
}

.nav-links{
  display:flex;
  align-items:center;
  gap:24px;
}

.nav-links a{
  text-decoration:none;
  color:#fff;
  font-size:14px;
}

.nav-button{
  background:#f36b16;
  padding:10px 16px;
  border-radius:8px;
  font-weight:bold;
}

/* HERO */

.hero{
  background:
    linear-gradient(
      135deg,
      #211a16 0%,
      #38261b 55%,
      #f36b16 140%
    );
  color:white;
  padding:90px 0 85px;
}

.hero-grid{
  display:grid;
  grid-template-columns:1.1fr .9fr;
  gap:50px;
  align-items:center;
}

.hero h1{
  font-size:clamp(38px,6vw,64px);
  line-height:1.05;
  margin:0 0 20px;
}

.hero h1 span{
  color:#ff9a59;
}

.hero-text{
  color:#eadfd8;
  max-width:650px;
  font-size:17px;
}

.hero-buttons{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-top:28px;
}

.btn{
  display:inline-block;
  padding:14px 20px;
  border-radius:9px;
  text-decoration:none;
  font-weight:bold;
  border:1px solid transparent;
}

.btn-primary{
  background:#f36b16;
  color:white;
}

.btn-secondary{
  border-color:#ffffff55;
  color:white;
}

/* TRACK CARD */

.track-card{
  background:white;
  color:#211a16;
  padding:28px;
  border-radius:20px;
  box-shadow:0 20px 55px rgba(0,0,0,.22);
}

.track-card h2{
  margin:0 0 7px;
  font-size:24px;
}

.track-card p{
  color:#716861;
  margin-top:0;
}

.track-input{
  width:100%;
  padding:16px;
  border:1px solid #ded6cf;
  border-radius:9px;
  font-size:16px;
  outline:none;
  margin:12px 0;
}

.track-input:focus{
  border-color:#f36b16;
}

.track-button{
  width:100%;
  border:0;
  padding:16px;
  border-radius:9px;
  background:#f36b16;
  color:white;
  font-weight:bold;
  cursor:pointer;
  font-size:15px;
}

.error{
  display:none;
  margin-top:14px;
  color:#a93226;
  font-size:14px;
}

/* TRUST STRIP */

.trust-strip{
  background:white;
  border-bottom:1px solid #e8e2dc;
}

.trust-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
  padding:24px 0;
}

.trust-item{
  display:flex;
  gap:12px;
  align-items:center;
}

.trust-icon{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#fff1e7;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}

.trust-item strong{
  display:block;
}

.trust-item span{
  color:#777;
  font-size:13px;
}

/* GENERAL SECTIONS */

section{
  padding:75px 0;
}

.section-heading{
  max-width:700px;
  margin-bottom:35px;
}

.section-heading h2{
  font-size:36px;
  margin:0 0 10px;
}

.section-heading p{
  color:#706861;
}

/* SERVICES */

.services{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.service{
  background:white;
  border:1px solid #eee8e2;
  padding:28px;
  border-radius:16px;
  box-shadow:0 7px 25px rgba(30,20,10,.05);
}

.service-icon{
  font-size:30px;
  margin-bottom:15px;
}

.service h3{
  margin:0 0 8px;
}

.service p{
  color:#716861;
  margin-bottom:0;
}

/* HOW IT WORKS */

.steps{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:20px;
}

.step{
  position:relative;
  background:#211a16;
  color:white;
  border-radius:16px;
  padding:26px;
}

.step-number{
  width:38px;
  height:38px;
  border-radius:50%;
  background:#f36b16;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  margin-bottom:20px;
}

.step p{
  color:#cfc5be;
  font-size:14px;
}

/* ABOUT */

.about{
  background:#fffaf5;
}

.about-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:45px;
  align-items:center;
}

.about-box{
  background:white;
  border-radius:18px;
  padding:30px;
  box-shadow:0 8px 30px rgba(30,20,10,.06);
}

.about-box h3{
  margin-top:0;
}

.about-list{
  padding:0;
  list-style:none;
}

.about-list li{
  margin:13px 0;
}

.about-list li::before{
  content:"✓";
  color:#f36b16;
  font-weight:bold;
  margin-right:9px;
}

/* TRACKING RESULT */

.result-section{
  display:none;
  background:#f0ebe5;
}

.result{
  background:white;
  border-radius:20px;
  padding:30px;
  box-shadow:0 10px 35px rgba(30,20,10,.08);
}

.result-header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:20px;
  flex-wrap:wrap;
}

.result-header h2{
  margin:0;
  font-size:30px;
}

.tracking-label{
  color:#777;
  margin-top:4px;
}

.badge{
  display:inline-block;
  background:#fff0e5;
  color:#b64e0b;
  border-radius:30px;
  padding:9px 14px;
  font-weight:bold;
  font-size:13px;
}

/* ROUTE */

.route{
  margin-top:25px;
  padding:25px;
  background:#fff9f3;
  border-radius:15px;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  gap:20px;
  align-items:center;
}

.route-box small{
  display:block;
  color:#777;
  margin-bottom:4px;
}

.route-box strong{
  font-size:18px;
}

.route-arrow{
  font-size:27px;
  color:#f36b16;
}

/* INFO */

.info-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
  margin-top:20px;
}

.info{
  background:#faf8f5;
  padding:18px;
  border-radius:12px;
}

.info small{
  display:block;
  color:#777;
  margin-bottom:5px;
}

/* PACKAGE */

.package{
  margin-top:22px;
  padding:24px;
  background:#fff9f3;
  border-radius:15px;
}

.package h3{
  margin-top:0;
}

.package-image{
  width:100%;
  max-height:380px;
  object-fit:cover;
  border-radius:14px;
  margin-top:15px;
  display:none;
}

.image-note{
  color:#777;
  font-size:13px;
}

/* TIMELINE */

.timeline{
  margin-top:28px;
}

.timeline-item{
  display:flex;
  gap:15px;
  margin:20px 0;
}

.timeline-line{
  display:flex;
  flex-direction:column;
  align-items:center;
}

.dot{
  width:17px;
  height:17px;
  border-radius:50%;
  background:#d8d3ce;
  flex-shrink:0;
}

.dot.active{
  background:#f36b16;
}

.line{
  width:2px;
  height:35px;
  background:#ddd;
}

.timeline-item strong{
  display:block;
}

.timeline-item span{
  color:#777;
  font-size:14px;
}

/* UPDATE */

.update{
  margin-top:25px;
  background:#faf8f5;
  padding:22px;
  border-radius:15px;
}

/* SUPPORT */

.support{
  background:white;
  padding:32px;
  border-radius:18px;
  border:1px solid #eee7df;
}

.contact{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
  margin-top:25px;
}

.contact-box{
  background:#faf8f5;
  padding:20px;
  border-radius:12px;
}

.contact-box small{
  color:#777;
  display:block;
  margin-bottom:5px;
}

/* FOOTER */

footer{
  background:#171717;
  color:white;
  padding:50px 0 25px;
}

.footer-grid{
  display:grid;
  grid-template-columns:2fr 1fr 1fr;
  gap:35px;
}

footer h3{
  margin-top:0;
}

footer p,
footer li{
  color:#bbb;
  font-size:14px;
}

footer ul{
  padding:0;
  list-style:none;
}

footer li{
  margin:8px 0;
}

.footer-bottom{
  border-top:1px solid #ffffff18;
  margin-top:35px;
  padding-top:20px;
  font-size:13px;
  color:#888;
}

/* MOBILE */

@media(max-width:800px){

  .nav-links{
    display:none;
  }

  .hero{
    padding:60px 0;
  }

  .hero-grid,
  .about-grid{
    grid-template-columns:1fr;
  }

  .services,
  .steps{
    grid-template-columns:1fr 1fr;
  }

  .trust-grid{
    grid-template-columns:1fr;
  }

  .footer-grid{
    grid-template-columns:1fr;
  }
}

@media(max-width:600px){

  section{
    padding:55px 0;
  }

  .services,
  .steps,
  .contact,
  .info-grid{
    grid-template-columns:1fr;
  }

  .route{
    grid-template-columns:1fr;
    text-align:center;
  }

  .route-arrow{
    transform:rotate(90deg);
  }

  .result{
    padding:20px;
  }

  .hero h1{
    font-size:40px;
  }

  .hero-buttons{
    flex-direction:column;
  }

  .btn{
    text-align:center;
  }
}
</style>
</head>

<header>
  <div class="
